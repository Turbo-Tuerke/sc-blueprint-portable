<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Abstrakte Item-Scan-Vorschau</title>
  <desc id="desc">Eine technische holografische Darstellung als Platzhalter für ein Star-Citizen-Item.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061923"/>
      <stop offset=".52" stop-color="#082637"/>
      <stop offset="1" stop-color="#030b12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#63e5ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#63e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#63e5ff" stroke-opacity=".075"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <ellipse cx="600" cy="337" rx="390" ry="260" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="none" stroke="#63e5ff">
    <path d="M142 116h186m544 0h186M142 559h186m544 0h186" stroke-opacity=".3" stroke-width="2"/>
    <path d="M142 116v88m916-88v88M142 471v88m916-88v88" stroke-opacity=".55" stroke-width="4"/>
    <ellipse cx="600" cy="337" rx="305" ry="182" stroke-opacity=".23" stroke-width="2" stroke-dasharray="10 16"/>
    <ellipse cx="600" cy="337" rx="230" ry="126" stroke-opacity=".45"/>
    <path d="M398 371l70-92 151-24 106 56 76 87-152 25-139-16z" fill="#63e5ff" fill-opacity=".055" stroke-width="3"/>
    <path d="M468 279l42 128m109-152l30 168m76-112l-204 77m77-123l-82 111" stroke-opacity=".32"/>
    <circle cx="468" cy="279" r="7" fill="#ffbd59" stroke="none"/>
    <circle cx="725" cy="311" r="7" fill="#ffbd59" stroke="none"/>
    <circle cx="649" cy="423" r="7" fill="#ffbd59" stroke="none"/>
  </g>
  <g fill="#9cd8e7" font-family="Consolas, monospace" letter-spacing="4">
